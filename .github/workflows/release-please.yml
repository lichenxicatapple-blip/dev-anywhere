name: Release Please

on:
  push:
    branches:
      - main

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  verify:
    name: Verify main
    uses: ./.github/workflows/ci.yml

  verify-chaos:
    name: Verify process Chaos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure isolated local runtime
        run: |
          mkdir -p "$HOME/.dev-anywhere"
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          fs.writeFileSync(
            path.join(process.env.HOME, ".dev-anywhere", "config.json"),
            JSON.stringify(
              {
                defaultProfile: "local",
                profiles: { local: { relay: "local" } },
                relays: { local: { url: "ws://localhost:3100" } },
              },
              null,
              2,
            ) + "\n",
          );
          NODE

      - name: Install Chromium
        run: pnpm --filter @dev-anywhere/web exec playwright install --with-deps chromium

      - name: Run process Chaos release gate
        run: RELEASE_DEEP_SCOPE=chaos RELEASE_DEEP_SKIP_FAST=1 pnpm release:deep

      - name: Upload Chaos service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: process-chaos-service-logs-${{ github.run_attempt }}
          path: ~/.dev-anywhere
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  release-please:
    name: Prepare or create release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Maintain Release PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish release artifacts
    needs:
      - verify
      - verify-chaos
      - release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
