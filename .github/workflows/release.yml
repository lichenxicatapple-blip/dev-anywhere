name: Release

run-name: Release ${{ inputs.tag_name || github.ref_name }}

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  resolve-release:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Validate release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  publish-images:
    name: Publish Docker image
    needs: resolve-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Detect Aliyun ACR secrets
        id: acr
        run: |
          if [ -n "${{ secrets.ACR_USERNAME }}" ] && [ -n "${{ secrets.ACR_NAMESPACE }}" ] && [ -n "${{ secrets.ACR_REGISTRY }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        if: steps.acr.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            name=ghcr.io/${{ github.repository_owner }}/dev-anywhere-relay
            name=${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/dev-anywhere-relay,enable=${{ steps.acr.outputs.enabled == 'true' }}
          tags: |
            type=raw,value=${{ needs.resolve-release.outputs.tag }}
            type=semver,pattern={{version}},value=${{ needs.resolve-release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve-release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.resolve-release.outputs.tag }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/relay/Dockerfile
          push: true
          # Aliyun ACR rejects the OCI attestation manifests emitted by Buildx.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dev-anywhere-relay
          cache-to: type=gha,mode=max,scope=dev-anywhere-relay

  publish-npm:
    name: Publish npm packages
    needs: resolve-release
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Verify package versions
        env:
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          node <<'NODE'
          const expected = process.env.RELEASE_VERSION;
          const files = [
            "package.json",
            "apps/proxy/package.json",
            "apps/relay/package.json",
            "apps/web/package.json",
            "packages/shared/package.json",
          ];
          for (const file of files) {
            const actual = require(`./${file}`).version;
            if (actual !== expected) {
              throw new Error(`${file}: expected ${expected}, got ${actual}`);
            }
          }
          NODE

      - name: Verify npm auth
        run: |
          npm whoami
          npm owner ls @dev-anywhere/proxy
          npm owner ls @dev-anywhere/relay

      - name: Publish @dev-anywhere/relay
        run: |
          VERSION="${{ needs.resolve-release.outputs.version }}"
          if npm view "@dev-anywhere/relay@$VERSION" version >/dev/null 2>&1; then
            echo "@dev-anywhere/relay@$VERSION is already published"
          else
            pnpm --filter @dev-anywhere/relay publish --no-git-checks --access public
          fi

      - name: Publish @dev-anywhere/proxy
        run: |
          VERSION="${{ needs.resolve-release.outputs.version }}"
          if npm view "@dev-anywhere/proxy@$VERSION" version >/dev/null 2>&1; then
            echo "@dev-anywhere/proxy@$VERSION is already published"
          else
            pnpm --filter @dev-anywhere/proxy publish --no-git-checks --access public
          fi

      - name: Verify npm packages are published
        run: |
          VERSION="${{ needs.resolve-release.outputs.version }}"
          for pkg in @dev-anywhere/proxy @dev-anywhere/relay; do
            for attempt in $(seq 1 12); do
              published="$(npm view "$pkg@$VERSION" version 2>/dev/null || true)"
              if [ "$published" = "$VERSION" ]; then
                echo "$pkg@$VERSION is available on npm"
                break
              fi
              if [ "$attempt" = "12" ]; then
                echo "ERROR: $pkg@$VERSION is not available on npm" >&2
                exit 1
              fi
              sleep 5
            done
          done

  ensure-github-release:
    name: Ensure GitHub Release
    needs:
      - resolve-release
      - publish-images
      - publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create missing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
