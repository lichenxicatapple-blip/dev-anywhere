name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # Playwright 1.52 can silently hang with newer Node 22 patch releases.
          # Keep CI on the runtime used by the repeated local stability gate.
          node-version: "22.22.0"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm release:check

      - run: pnpm test -- --bail=1

  browser-smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    # Keep Chromium and Linux dependencies aligned with the Playwright version
    # in pnpm-lock.yaml instead of inheriting a moving hosted-runner image.
    container:
      image: mcr.microsoft.com/playwright:v1.52.0-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Hosted browser gates are intentionally serial. Parallel workers have
      # previously hung before reporting their first test on GitHub runners.
      - run: pnpm test:layout -- --workers=1 --reporter=line

      - run: pnpm test:pc -- --workers=1 --reporter=line
