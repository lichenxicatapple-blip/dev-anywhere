name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # Playwright 1.52 can silently hang with newer Node 22 patch releases.
          # Keep CI on the runtime used by the repeated local stability gate.
          node-version: "22.22.0"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm release:check

      - run: pnpm test -- --bail=1

  browser-smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @dev-anywhere/web exec playwright install --with-deps chromium

      - run: pnpm test:layout

      - run: pnpm test:pc
