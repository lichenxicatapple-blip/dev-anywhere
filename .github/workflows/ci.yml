name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # Playwright 1.52 can silently hang with newer Node 22 patch releases.
          # Keep CI on the runtime used by the repeated local stability gate.
          node-version: "22.22.2"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm release:check

      - run: pnpm test -- --bail=1

  browser-smoke:
    name: Browser smoke
    # Keep the hosted browser image reproducible across release runs.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @dev-anywhere/web exec playwright install --with-deps chromium

      # Hosted browser gates are intentionally serial. Parallel workers have
      # previously hung before reporting their first test on GitHub runners.
      - run: pnpm test:layout -- --workers=1 --max-failures=1 --reporter=line

      - run: pnpm test:pc -- --workers=1 --max-failures=1 --reporter=line

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            apps/web/test-results
            artifacts/test-layout
            artifacts/test-pc

  windows-proxy:
    name: Native Windows Proxy
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Test native processes, IPC, terminal handover and startup registration
        shell: pwsh
        run: |
          $tests = @(
            'src/__tests__/unit/executable.test.ts',
            'src/__tests__/unit/command-launch.test.ts',
            'src/__tests__/unit/provider-claude.test.ts',
            'src/__tests__/unit/provider-working-directory.test.ts',
            'src/__tests__/unit/relay-resource-path.test.ts',
            'src/__tests__/unit/postinstall.test.ts',
            'src/__tests__/unit/windows-process.test.ts',
            'src/__tests__/unit/managed-session-process.test.ts',
            'src/__tests__/unit/android-emulator-adapter.test.ts',
            'src/__tests__/unit/process-termination.test.ts',
            'src/__tests__/unit/service-autostart.test.ts',
            'src/__tests__/unit/profile-paths.test.ts',
            'src/__tests__/unit/local-ipc-endpoint.test.ts',
            'src/__tests__/unit/service-control.test.ts',
            'src/__tests__/unit/service-lifecycle.test.ts',
            'src/__tests__/unit/worker-registry-reconnect.test.ts',
            'src/__tests__/unit/worker-registry-spawn.test.ts',
            'src/__tests__/unit/serve-socket-takeover.test.ts',
            'src/__tests__/integration/local-ipc-endpoint.test.ts',
            'src/__tests__/integration/pty-process.test.ts',
            'src/__tests__/integration/file-lock-process.test.ts',
            'src/__tests__/integration/daemon-cli-lifecycle-process.test.ts',
            'src/__tests__/integration/windows-process.test.ts'
          )
          pnpm --filter @dev-anywhere/proxy exec vitest run @tests --testTimeout=60000 --hookTimeout=30000
