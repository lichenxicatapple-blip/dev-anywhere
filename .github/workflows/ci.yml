name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # Playwright 1.52 can silently hang with newer Node 22 patch releases.
          # Keep CI on the runtime used by the repeated local stability gate.
          node-version: "22.22.2"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm release:check

      - run: pnpm test -- --bail=1

  browser-smoke:
    name: Browser smoke
    # Keep the hosted browser image reproducible across release runs.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @dev-anywhere/web exec playwright install --with-deps chromium

      # Hosted browser gates are intentionally serial. Parallel workers have
      # previously hung before reporting their first test on GitHub runners.
      - run: pnpm test:layout -- --workers=1 --max-failures=1 --reporter=line

      - run: pnpm test:pc -- --workers=1 --max-failures=1 --reporter=line

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            apps/web/test-results
            artifacts/test-layout
            artifacts/test-pc

  system-services:
    name: Native system service (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dev-anywhere/shared build
      - name: Test a disposable system service under the runner account
        env:
          DEV_ANYWHERE_TEST_SYSTEM_SERVICE: "1"
        run: pnpm --filter @dev-anywhere/proxy exec vitest run src/__tests__/integration/system-service-registration.test.ts --maxWorkers=1

  windows-proxy:
    name: Native Windows Proxy
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test online installer with Windows PowerShell and PowerShell 7
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/deploy/install-powershell.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/deploy/install-powershell.test.ps1 -InstallerPath ./install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/deploy/install-powershell.test.ps1
          & ./scripts/deploy/install-powershell.test.ps1 -InstallerPath ./install.ps1
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Test native development commands and Vite reconnect handling
        run: pnpm test:dev
      - name: Test a disposable SCM service under an ordinary user without desktop login
        env:
          DEV_ANYWHERE_TEST_SYSTEM_SERVICE: "1"
        run: pnpm --filter @dev-anywhere/proxy exec vitest run src/__tests__/integration/windows-system-service.test.ts --maxWorkers=1 --hookTimeout=30000
      - name: Test native processes, IPC, terminal handover and startup registration
        shell: pwsh
        run: |
          $tests = @(
            'src/__tests__/unit/executable.test.ts',
            'src/__tests__/unit/command-launch.test.ts',
            'src/__tests__/unit/provider-claude.test.ts',
            'src/__tests__/unit/provider-working-directory.test.ts',
            'src/__tests__/unit/provider-codex.test.ts',
            'src/__tests__/unit/pty-input-compat.test.ts',
            'src/__tests__/unit/pty-manager.test.ts',
            'src/__tests__/unit/pty-runtime.test.ts',
            'src/__tests__/unit/terminal-shell.test.ts',
            'src/__tests__/unit/relay-terminal-shell.test.ts',
            'src/__tests__/unit/remote-file-path.test.ts',
            'src/__tests__/unit/relay-resource-path.test.ts',
            'src/__tests__/unit/postinstall.test.ts',
            'src/__tests__/unit/windows-process.test.ts',
            'src/__tests__/unit/managed-session-process.test.ts',
            'src/__tests__/unit/android-emulator-adapter.test.ts',
            'src/__tests__/unit/process-termination.test.ts',
            'src/__tests__/unit/service-autostart.test.ts',
            'src/__tests__/unit/system-service-autostart.test.ts',
            'src/__tests__/unit/service-host-control.test.ts',
            'src/__tests__/unit/windows-autostart-launcher.test.ts',
            'src/__tests__/unit/profile-paths.test.ts',
            'src/__tests__/unit/local-ipc-endpoint.test.ts',
            'src/__tests__/unit/service-control.test.ts',
            'src/__tests__/unit/service-lifecycle.test.ts',
            'src/__tests__/unit/worker-registry-reconnect.test.ts',
            'src/__tests__/unit/worker-registry-spawn.test.ts',
            'src/__tests__/unit/worker-connection.test.ts',
            'src/__tests__/unit/preview-worker-client.test.ts',
            'src/__tests__/unit/preview-runtime.test.ts',
            'src/__tests__/unit/preview-worker-logger.test.ts',
            'src/__tests__/integration/local-ipc-endpoint.test.ts',
            'src/__tests__/integration/pty-process.test.ts',
            'src/__tests__/integration/file-lock-process.test.ts',
            'src/__tests__/integration/daemon-cli-lifecycle-process.test.ts',
            'src/__tests__/integration/windows-process.test.ts',
            'src/__tests__/integration/windows-autostart-launcher.test.ts',
            'src/__tests__/integration/windows-system-service.test.ts'
          )
          # Native process suites share the runner's PowerShell/CIM capacity.
          pnpm --filter @dev-anywhere/proxy exec vitest run @tests --maxWorkers=1 --testTimeout=60000 --hookTimeout=30000
